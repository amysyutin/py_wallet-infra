apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: py-wallet-dev
          podSelector:
            matchLabels:
              app: py-wallet
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: py-wallet-dev
          podSelector:
            matchLabels:
              app: py-wallet-snapshot-service
      ports:
        - protocol: TCP
          port: 5432
