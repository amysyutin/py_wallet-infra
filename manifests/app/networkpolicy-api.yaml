apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: py-wallet-api-ingress
spec:
  podSelector:
    matchLabels:
      app: py-wallet
  policyTypes:
    - Ingress
  ingress:
    # Traefik runs in k3s' kube-system namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8000
    # Prometheus is installed in the dedicated monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
    # Jobs in the same application namespace call the internal API.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
